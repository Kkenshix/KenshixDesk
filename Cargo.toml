[package]
name = "kenshixdeck"
version = "0.3.4"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tungstenite = "0.29"
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = '0.26', default-features = false }
arboard = { version = '3.6', default-features = false }
windows = { version = "0.62", features = [
    "Media_Control", "Foundation", "Win32_System_WinRT", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory",
    "Win32_System_Com", "Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
rfd = { version = "0.16", default-features = false }
ring = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
