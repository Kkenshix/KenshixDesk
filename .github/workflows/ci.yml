name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Format, lint, test, build
        shell: pwsh
        env:
          DECK_SHA: ${{ github.sha }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.97.1 fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.97.1 test --workspace --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.97.1 build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-x64-CI
          path: target/release/kenshixdeck.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: APK, lint ve test
        working-directory: android
        env:
          DECK_SHA: ${{ github.sha }}
          DECK_BUILD: ${{ github.run_number }}
        run: bash ./gradlew assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Android-debug-CI
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
